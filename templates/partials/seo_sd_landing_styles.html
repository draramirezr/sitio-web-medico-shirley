<style>
  .seo-sd-page {
    --seo-ink: #3a2830;
    --seo-muted: #6b5c62;
    --seo-rose: #CEB0B7;
    --seo-rose-deep: #6B3A4B;
    --seo-cream: #faf6f7;
  }

  .seo-sd-hero {
    position: relative;
    min-height: 88vh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    background: #6B3A4B;
  }
  .seo-sd-hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 18%;
    z-index: 0;
  }
  .seo-sd-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(105deg, rgba(58, 40, 48, 0.88) 0%, rgba(107, 58, 75, 0.62) 45%, rgba(107, 58, 75, 0.22) 100%),
      linear-gradient(180deg, rgba(58, 40, 48, 0.12) 0%, rgba(58, 40, 48, 0.55) 100%);
  }
  .seo-sd-hero-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 7.5rem 0 4.5rem;
  }
  .seo-sd-lang {
    color: rgba(255,255,255,0.72);
    font-size: 0.82rem;
    letter-spacing: 0.04em;
    margin-bottom: 1.1rem;
  }
  .seo-sd-lang a {
    color: rgba(255,255,255,0.92);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.35);
  }
  .seo-sd-lang a:hover { border-bottom-color: #fff; }
  .seo-sd-brand {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 5.5vw, 4.1rem);
    line-height: 1.05;
    color: #fff;
    margin: 0 0 0.65rem;
    max-width: 14ch;
    opacity: 0;
    transform: translateY(18px);
    animation: seoSdIn 0.9s ease forwards 0.15s;
  }
  .seo-sd-headline {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(1.05rem, 2vw, 1.35rem);
    color: rgba(255,255,255,0.92);
    margin: 0 0 0.85rem;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(18px);
    animation: seoSdIn 0.9s ease forwards 0.32s;
  }
  .seo-sd-lead {
    color: rgba(255,255,255,0.82);
    font-size: 1.05rem;
    line-height: 1.65;
    max-width: 34rem;
    margin: 0 0 1.75rem;
    opacity: 0;
    transform: translateY(18px);
    animation: seoSdIn 0.9s ease forwards 0.48s;
  }
  .seo-sd-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 0.85rem;
    opacity: 0;
    transform: translateY(18px);
    animation: seoSdIn 0.9s ease forwards 0.62s;
  }
  .seo-sd-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.9rem 1.35rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  .seo-sd-btn:hover { transform: translateY(-2px); }
  .seo-sd-btn--solid {
    background: #fff;
    color: var(--seo-rose-deep);
  }
  .seo-sd-btn--ghost {
    background: transparent;
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.55);
  }
  .seo-sd-btn--ghost:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  @keyframes seoSdIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .seo-sd-section {
    padding: 4.5rem 0;
  }
  .seo-sd-section--soft {
    background:
      radial-gradient(ellipse at top right, rgba(206,176,183,0.22), transparent 55%),
      linear-gradient(180deg, #fff 0%, var(--seo-cream) 100%);
  }
  .seo-sd-kicker {
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--seo-rose-deep);
    margin-bottom: 0.75rem;
  }
  .seo-sd-h2 {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(1.75rem, 3vw, 2.35rem);
    color: var(--seo-ink);
    margin: 0 0 0.85rem;
    line-height: 1.15;
  }
  .seo-sd-copy {
    color: var(--seo-muted);
    font-size: 1.05rem;
    line-height: 1.75;
    max-width: 40rem;
    margin: 0;
  }

  .seo-sd-trust {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 3rem;
    align-items: center;
  }
  .seo-sd-trust-photo {
    width: 100%;
    height: auto;
    aspect-ratio: 819 / 1024;
    object-fit: contain;
    object-position: center top;
    background: #fff;
    border-radius: 0;
  }
  .seo-sd-trust-list {
    list-style: none;
    padding: 0;
    margin: 1.5rem 0 0;
  }
  .seo-sd-trust-list li {
    position: relative;
    padding: 0.85rem 0 0.85rem 1.5rem;
    border-top: 1px solid rgba(206,176,183,0.45);
    color: var(--seo-ink);
    font-weight: 600;
    line-height: 1.45;
  }
  .seo-sd-trust-list li:last-child { border-bottom: 1px solid rgba(206,176,183,0.45); }
  .seo-sd-trust-list li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 1.25rem;
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--seo-rose);
  }
  .seo-sd-trust-list span {
    display: block;
    margin-top: 0.2rem;
    color: var(--seo-muted);
    font-weight: 400;
    font-size: 0.95rem;
  }

  .seo-sd-services {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.5rem 2.5rem;
    margin-top: 2rem;
  }
  .seo-sd-service h3 {
    font-family: "Playfair Display", serif;
    font-size: 1.35rem;
    color: var(--seo-ink);
    margin: 0 0 0.4rem;
  }
  .seo-sd-service p {
    color: var(--seo-muted);
    margin: 0;
    line-height: 1.6;
  }

  .seo-sd-place {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: end;
  }
  .seo-sd-place-line {
    width: 3rem;
    height: 2px;
    background: var(--seo-rose);
    margin: 1.1rem 0;
  }
  .seo-sd-place a {
    color: var(--seo-rose-deep);
    font-weight: 700;
    text-decoration: none;
  }
  .seo-sd-place a:hover { text-decoration: underline; }

  .seo-sd-faq .accordion-item {
    border: none;
    border-bottom: 1px solid rgba(206,176,183,0.5);
    background: transparent;
  }
  .seo-sd-faq .accordion-button {
    background: transparent;
    box-shadow: none !important;
    color: var(--seo-ink);
    font-weight: 700;
    font-size: 1.05rem;
    padding-left: 0;
    padding-right: 0;
  }
  .seo-sd-faq .accordion-button:not(.collapsed) {
    background: transparent;
    color: var(--seo-rose-deep);
  }
  .seo-sd-faq .accordion-body {
    padding-left: 0;
    color: var(--seo-muted);
    line-height: 1.7;
  }

  .seo-sd-close {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #6B3A4B 0%, #8d5566 55%, #CEB0B7 140%);
    color: #fff;
    text-align: center;
    padding: 4.5rem 1.25rem;
  }
  .seo-sd-close h2 {
    font-family: "Playfair Display", serif;
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    margin: 0 0 0.75rem;
  }
  .seo-sd-close p {
    max-width: 32rem;
    margin: 0 auto 1.5rem;
    color: rgba(255,255,255,0.85);
    line-height: 1.65;
  }
  .seo-sd-close .seo-sd-btn--solid { color: #6B3A4B; }

  .seo-sd-reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .seo-sd-reveal.is-in {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 900px) {
    .seo-sd-hero { min-height: 78vh; align-items: center; }
    .seo-sd-hero-inner { padding: 6.5rem 0 3.5rem; }
    .seo-sd-trust,
    .seo-sd-place,
    .seo-sd-services { grid-template-columns: 1fr; gap: 1.5rem; }
    .seo-sd-trust-photo { max-height: 420px; }
  }
</style>
